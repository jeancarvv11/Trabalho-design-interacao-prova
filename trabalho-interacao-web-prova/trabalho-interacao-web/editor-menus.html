<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhos de Interação Web</title>
    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variaveis.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/editor.css">
    <script src="js/componentes/site-footer.js" defer></script>
    <script src="js/componentes/site-header.js" defer></script>
    <script src="js/componentes/site-nav.js" defer></script>
</head>
<body>
    <site-header>
        <site-nav></site-nav>
    </site-header>

    <main>
        <form id="form-editor">
            <fieldset>
                <legend>Imagem do menu</legend>

                <label for="input-imagem">Escolha uma imagem:</label>
                <input type="file" id="input-imagem" name="imagem" accept="image/*">

                <p>Posição da imagem:</p>

                <input type="radio" id="posicao-cima" name="posicao-imagem" value="cima" checked>
                <label for="posicao-cima">Em cima do menu</label>

                <input type="radio" id="posicao-lado" name="posicao-imagem" value="lado">
                <label for="posicao-lado">Ao lado do menu</label>
            </fieldset>
            <fieldset>
                <legend>Itens do menu</legend>

                <div id="lista-itens-menu"></div>

                <button type="button" id="btn-adicionar-item">+ Adicionar item</button>
            </fieldset>
            <fieldset>
                <legend>Aparência do menu</legend>

                <label for="cor-fundo-menu">Cor de fundo do menu:</label>
                <input type="color" id="cor-fundo-menu" name="cor-fundo-menu" value="#1c1c1c">

                <label for="cor-fundo-item">Cor de fundo dos itens:</label>
                <input type="color" id="cor-fundo-item" name="cor-fundo-item" value="#333333">

                <label for="espacamento-itens">Espaçamento entre os itens:</label>
                <input type="range" id="espacamento-itens" name="espacamento-itens" min="0" max="40" value="10">
                <span id="valor-espacamento">10px</span>
            </fieldset>
            <fieldset>
                <legend>Texto e bordas</legend>

                <label for="cor-texto-item">Cor do texto:</label>
                <input type="color" id="cor-texto-item" name="cor-texto-item" value="#f4f4f4">

                <label for="tamanho-fonte-item">Tamanho da fonte:</label>
                <input type="range" id="tamanho-fonte-item" name="tamanho-fonte-item" min="12" max="28" value="16">
                <span id="valor-tamanho-fonte">16px</span>

                <label for="cor-borda-item">Cor da borda:</label>
                <input type="color" id="cor-borda-item" name="cor-borda-item" value="#555555">

                <label for="espessura-borda-item">Espessura da borda:</label>
                <input type="range" id="espessura-borda-item" name="espessura-borda-item" min="0" max="10" value="1">
                <span id="valor-espessura-borda">1px</span>

                <label for="arredondamento-item">Arredondamento das bordas:</label>
                <input type="range" id="arredondamento-item" name="arredondamento-item" min="0" max="30" value="8">
                <span id="valor-arredondamento">8px</span>
            </fieldset>
        </form>
        <section id="preview-menu"></section>
    </main>

    <site-footer></site-footer>
    <script src="js/editor.js"></script>
</body>
</html>
